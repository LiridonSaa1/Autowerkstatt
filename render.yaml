services:
  - type: web
    name: service-car
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && node scripts/render-build.mjs
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: INTEGRATIONS_PASSWORD
        sync: false
